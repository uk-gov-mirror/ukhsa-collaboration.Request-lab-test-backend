services:

  # ==================================================
  # RLT API
  # ==================================================
  # api:
  #   build:
  #     context: ./api
  #   container_name: rlt-api
  #   environment:
  #     TERMINOLOGY_URL: http://terminology:4001
  #   ports:
  #     - "4000:4000"
  #   depends_on:
  #     terminology:
  #       condition: service_healthy
  #   networks:
  #     - rlt-network
  #   restart: unless-stopped

  # ==================================================
  # TERMINOLOGY SERVICE
  # ==================================================

  terminology:
    build:
      context: ./terminology
    container_name: rlt-terminology
    ports:
      - "4001:4001"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:4001/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - rlt-network
    restart: unless-stopped


  # ==================================================
  # FAKE MOLIS
  # ==================================================
  fake-molis:
    build:
      context: ./fake-molis
    container_name: rlt-fake-molis
    ports:
      - "4010:4010"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:4010/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - rlt-network
    restart: unless-stopped

  # ==================================================
  # FHIR ADAPTER
  # ==================================================

  fhir-adapter:
    build:
      context: ./fhir-adapter
    container_name: rlt-fhir-adapter
    environment:
      MOLIS_URL: http://fake-molis:4010
    ports:
      - "4002:4002"
    depends_on:
      - fake-molis
    networks:
      - rlt-network
    restart: unless-stopped


  # ==================================================
  # HL7 V2 ADAPTER
  # ==================================================
  hl7v2-adapter:
    build:
      context: ./hl7v2-adapter
    container_name: rlt-hl7v2-adapter
    ports:
      - "4006:4006"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:4006/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - rlt-network
    restart: unless-stopped


  # ==================================================
  # RESULT ADAPTER
  # ==================================================

  result-adapter:
    build:
      context: ./result-adapter
    container_name: rlt-result-adapter
    environment:
      FHIR_VALIDATOR_JAR:
        /tools/fhir-validator/validator_cli.jar
      PATHOLOGY_FHIR_IG:
        fhir.r4.nhsengland.pathology#0.3.1-alpha
    volumes:
      - ./tools/fhir-validator:/tools/fhir-validator:ro
    ports:
      - "4003:4003"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:4003/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - rlt-network
    restart: unless-stopped


  # ==================================================
  # PATHOLOGY ORCHESTRATOR
  # ==================================================

  pathology-orchestrator:
    build:
      context: ./pathology-orchestrator
    container_name: rlt-pathology-orchestrator
    environment:
      PORT: 4005
      TERMINOLOGY_URL:
        http://terminology:4001
      FHIR_ADAPTER_URL:
        http://fhir-adapter:4002
      HL7V2_ADAPTER_URL:
        http://hl7v2-adapter:4006
      MOLIS_URL:
        http://fake-molis:4010
      RESULT_ADAPTER_URL:
        http://result-adapter:4003
      # Used by your POC LIMS simulator if you
      # kept the FAKE_MOLIS_URL implementation.
      FAKE_MOLIS_URL:
        http://fake-molis:4010
      ENABLE_DEMO_LIMS_SIMULATOR:
        "true"
    ports:
      - "4005:4005"
    depends_on:
      - terminology
      - fhir-adapter
      - hl7v2-adapter
      - fake-molis
      - result-adapter
    networks:
      - rlt-network
    restart: unless-stopped

  # ==================================================
  # RLT WEB
  # ==================================================

  rlt-web:
    build:
      context:
        ./rlt-web
      args:
        VITE_ORCHESTRATOR_URL:
          /orchestrator
    container_name:
      rlt-web
    ports:
      - "8080:80"
    depends_on:
      - pathology-orchestrator
    networks:
      - rlt-network
    restart:
      unless-stopped

# ==================================================
# NETWORK
# ==================================================

networks:
  rlt-network:
    driver:
      bridge
